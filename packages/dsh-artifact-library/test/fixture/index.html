<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Artifact Library client fixture</title>
<style>
  :root {
    color-scheme: light;
    --dsw-alias-bg-base: #ffffff;
    --dsw-alias-bg-layer-1: #ffffff;
    --dsw-alias-bg-layer-2: #f4f4f5;
    --dsw-alias-bg-overlay: #ffffff;
    --dsw-alias-border-l1: #0000000a;
    --dsw-alias-border-l2: #0000001a;
    --dsw-alias-brand-primary: #0f1115;
    --dsw-alias-label-primary: #0f1115;
    --dsw-alias-label-secondary: #61666b;
    --dsw-alias-label-tertiary: #81858c;
    --dsw-alias-label-primary-inverted: #ffffff;
    --dsw-alias-link: #4176e6;
    --dsw-alias-state-error-primary: #ec1313;
    --dsw-alias-state-success-primary: #22c55e;
    --dsw-alias-state-warn-primary: #f59e0b;
    --dsw-alias-state-idle-primary: #a1a1aa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --dsw-alias-bg-base: #151517;
      --dsw-alias-bg-layer-1: #1e1e21;
      --dsw-alias-bg-layer-2: #26262a;
      --dsw-alias-bg-overlay: #1e1e21;
      --dsw-alias-border-l1: #ffffff14;
      --dsw-alias-border-l2: #ffffff24;
      --dsw-alias-brand-primary: #f9fafb;
      --dsw-alias-label-primary: #f9fafb;
      --dsw-alias-label-secondary: #adb2b8;
      --dsw-alias-label-tertiary: #81858c;
      --dsw-alias-label-primary-inverted: #151517;
      --dsw-alias-link: #7aaaff;
    }
  }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--dsw-alias-bg-base); }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  #panel { width: 100%; max-width: 1000px; height: 100vh; margin: 0 auto; }
</style>
</head>
<body>
<div id="panel"></div>
<script type="module" src="/fixture.js"></script>
